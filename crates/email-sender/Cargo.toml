[package]
name = "aegis-email-sender"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Ken C. Demanawa <kenneth.c.demanawa@gmail.com>"]
description = "Typed, provider-neutral email facade backed by aegis-mesg-sender-core"
license = "MIT"
repository = "https://github.com/kanutocd/aegis-mesg-senders"
readme = "README.md"
keywords = ["email", "resend", "mailgun", "mailpit"]

[features]
default = ["resend", "mailgun", "mailpit"]
resend = []
mailgun = []
mailpit = []

[dependencies]
aegis-mesg-sender-core = { path = "../mesg-sender-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = "warn"
