[package]
name = "aegis-sms-sender"
version = "0.1.0"
edition = "2021"
authors = ["Ken C. Demanawa <kenneth.c.demanawa@gmail.com>"]
rust-version = "1.75"
description = "Typed, provider-neutral SMS facade backed by aegis-mesg-sender-core"
license = "MIT"
repository = "https://github.com/kanutocd/aegis-mesg-senders"
readme = "README.md"
keywords = ["sms", "twilio", "textbee", "semaphore", "infobip"]

[dependencies]
aegis-mesg-sender-core = { path = "../mesg-sender-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
live-tests = []

[dev-dependencies]
ureq = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = "warn"
