name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --all-features --no-deps
      # The downstream crates' package checks require the core package to
      # exist in crates.io; those run in the release sequence after core is
      # published.
      - run: cargo package -p aegis-mesg-sender-core --allow-dirty

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --package aegis-mesg-sender-core --package aegis-email-sender --all-features --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: lcov.info
