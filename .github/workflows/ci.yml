name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --all-features --no-deps
      # The downstream crates' package checks require the core package to
      # exist in crates.io; those run in the release sequence after core is
      # published.
      - run: cargo package -p aegis-mesg-sender-core --allow-dirty

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage and enforce function, line, and region gates
        run: >-
          cargo +nightly llvm-cov --branch
          --package aegis-mesg-sender-core
          --package aegis-email-sender
          --all-features
          --json --output-path coverage.json
          --fail-under-functions 80
          --fail-under-lines 85
          --fail-under-regions 85
      - name: Generate LCOV report
        run: >-
          cargo +nightly llvm-cov --branch
          --package aegis-mesg-sender-core
          --package aegis-email-sender
          --all-features --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: |
            coverage.json
            lcov.info

  sms-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Enforce SMS coverage baseline
        run: >-
          cargo +nightly llvm-cov
          --package aegis-sms-sender --all-features
          --json --output-path sms-coverage.json
          --fail-under-functions 65
          --fail-under-lines 70
          --fail-under-regions 65
      - uses: actions/upload-artifact@v7
        with:
          name: sms-coverage
          path: sms-coverage.json
